[project]
name = "agent-reach"
version = "1.5.0+heals.1"
description = "theheals pinned fork of Agent-Reach (upstream a19a171) — Tier A read-only availability checker (web, youtube, rss, github)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Neo Reid"}]
maintainers = [{name = "theheals-company"}]
keywords = ["ai-agent", "cli", "youtube-transcript", "rss", "github", "web-reader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

# Supply-chain minimum (V2.7-04 CC-08 R-1/R-2): requests, python-dotenv, loguru and the
# optional extras browser/cookies/all were removed with the code that used them.
dependencies = [
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "yt-dlp[default]>=2026.07.04",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-PyYAML>=6.0",
]

[project.scripts]
agent-reach = "agent_reach.cli:main"

[project.urls]
Homepage = "https://github.com/theheals-company/agent-reach"
Repository = "https://github.com/theheals-company/agent-reach"
Upstream = "https://github.com/Panniantong/agent-reach"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_reach"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
